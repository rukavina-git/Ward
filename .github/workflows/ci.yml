name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs: a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build first: packages import each other's dist/ types, and the
      # stdio test spawns the built MCP server.
      - run: npm run build
      # The plugin ships a bundled server: the committed copy must match.
      - run: npm run plugin:build
      - run: test -z "$(git status --porcelain plugin/)"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
